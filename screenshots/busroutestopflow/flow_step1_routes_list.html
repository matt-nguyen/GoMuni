<script>
  (function() {
    const routeItems = document.querySelectorAll('.route-item');
    const selectionLabel = document.getElementById('selection-label');
    const filterPills = document.querySelectorAll('.filter-pill');

    function selectRoute(element) {
      routeItems.forEach(item => {
        item.classList.remove('bg-surface-card', 'border-electric-alert');
        item.classList.add('bg-surface', 'border-transparent');
        const checkIcon = item.querySelector('.material-symbols-outlined');
        if (checkIcon) checkIcon.remove();
      });

      element.classList.remove('bg-surface', 'border-transparent');
      element.classList.add('bg-surface-card', 'border-electric-alert');

      const actionArea = element.querySelector('.flex.items-center.gap-space-xs');
      if (actionArea && !actionArea.querySelector('.material-symbols-outlined')) {
        const check = document.createElement('span');
        check.className = 'material-symbols-outlined text-signal-chartreuse text-[18px]';
        check.textContent = 'check';
        actionArea.appendChild(check);
      } else if (!actionArea) {
        const modeTag = element.querySelector('.font-label-caption');
        if (modeTag) {
          const wrapper = document.createElement('div');
          wrapper.className = 'flex items-center gap-space-xs shrink-0';
          modeTag.parentNode.insertBefore(wrapper, modeTag);
          wrapper.appendChild(modeTag);
          const check = document.createElement('span');
          check.className = 'material-symbols-outlined text-signal-chartreuse text-[18px]';
          check.textContent = 'check';
          wrapper.appendChild(check);
        }
      }

      const routeName = element.getAttribute('data-route');
      if (selectionLabel && routeName) {
        selectionLabel.textContent = 'Route: ' + routeName;
      }
    }

    routeItems.forEach(item => {
      item.addEventListener('click', () => selectRoute(item));
    });

    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => {
          p.classList.remove('bg-editorial-paper', 'text-editorial-black');
          p.classList.add('bg-surface-card', 'text-on-surface');
        });
        pill.classList.remove('bg-surface-card', 'text-on-surface');
        pill.classList.add('bg-editorial-paper', 'text-editorial-black');

        const filterName = pill.textContent.trim();
        routeItems.forEach(item => {
          const mode = item.getAttribute('data-mode');
          if (filterName === 'All' || mode === filterName) {
            item.style.display = 'flex';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
  })();
</script></main><!-- 3-Tab Bottom Navigation Bar --><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl border-t border-hairline-gray"><div class="flex justify-around items-stretch h-16 px-space-xs"><a aria-current="page" class="flex-1 flex flex-col items-center justify-center gap-1 transition-colors py-2 text-signal-chartreuse font-bold" data-path="explore-lines" href="#"><span class="material-symbols-outlined text-[22px]">explore</span><span class="font-label-caption text-[11px] uppercase tracking-wider">Explore</span></a><a class="flex-1 flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-editorial-paper transition-colors py-2" data-path="saved-stops" href="#"><span class="material-symbols-outlined text-[22px]">bookmark</span><span class="font-label-caption text-[11px] uppercase tracking-wider">Saved</span></a><a class="flex-1 flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-editorial-paper transition-colors py-2" data-path="alerts" href="#"><span class="material-symbols-outlined text-[22px]">warning</span><span class="font-label-caption text-[11px] uppercase tracking-wider">Alerts</span></a></div></nav>
